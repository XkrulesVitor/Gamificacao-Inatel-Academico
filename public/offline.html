<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3b5a">
  <meta name="color-scheme" content="dark">
  <title>Sem conexão · Acadêmico Inatel</title>
  <style>
    :root {
      --bg: #000000;
      --header: #1d3b5a;
      --fg: #f2f4f7;
      --muted: #9aa4b2;
      --accent: #0b63d6;
      --accent-hover: #1573e6;
      --gold: #f5b301;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      background: var(--header);
      padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.01em;
    }
    header span { color: var(--gold); }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #111820;
      border: 2px solid var(--header);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .icon svg { width: 36px; height: 36px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; max-width: 32ch; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      padding: 14px 24px;
      min-width: 200px;
      min-height: 48px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <header>Acadêmico <span>Inatel</span></header>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f5b301" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Você está offline</h1>
    <p>Não foi possível carregar esta página. Verifique sua conexão e tente novamente.</p>
    <button type="button" id="retry">Tentar novamente</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () {
      location.reload();
    });
  </script>
</body>
</html>
